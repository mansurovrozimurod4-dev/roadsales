<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadsales — Avtobus va Taksi Bazari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body { background-color: #0066ff; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
        .main-card { background: #fff; color: #333; border-radius: 16px; padding: 24px; }
        .badge-custom { background-color: #e6f0ff; color: #0066ff; font-weight: 600; }
        .bron-box { background-color: #f8f9fa; border-radius: 8px; padding: 10px; margin-top: 10px; }
        .btn-google { background-color: #ffffff; color: #757575; font-weight: 600; border: 1px solid #ddd; }
        .btn-google:hover { background-color: #f1f1f1; color: #333; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="container py-3 d-flex justify-content-between align-items-center">
        <h3 class="fw-bold m-0 text-white">roadsales</h3>
        <div id="authContainer" class="d-flex gap-2 align-items-center">
            <!-- Google tugmasi JS orqali joylashadi -->
        </div>
    </div>

    <!-- Main Content -->
    <div class="container my-4 text-center">
        <h1 class="fw-bold mb-4">Bu yerdan arzon safar chiptalarini sotib oling</h1>
        
        <div class="main-card text-start shadow-lg">
            <h4 class="fw-bold mb-4 text-dark">Mavjud reyslar</h4>
            <div id="reyslarContainer">
                <p class="text-muted text-center py-4">Reyslar yuklanmoqda...</p>
            </div>
        </div>
    </div>

    <!-- Reys Kiritish Modali -->
    <div class="modal fade text-dark" id="addModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Yangi reys qo'shish</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reysForm">
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Qayerdan</label>
                            <input type="text" id="qayerdan" class="form-control" placeholder="Masalan: Jizzax" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Qayerga</label>
                            <input type="text" id="qayerga" class="form-control" placeholder="Masalan: Guliston" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">Jo'nash vaqti</label>
                                <input type="datetime-local" id="vaqt" class="form-control" required>
                            </div>
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">Bo'sh joylar</label>
                                <input type="number" id="joy" class="form-control" placeholder="4" min="1" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">Telefon</label>
                                <input type="text" id="tel" class="form-control" placeholder="918888888" required>
                            </div>
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">Narxi (UZS)</label>
                                <input type="number" id="narx" class="form-control" placeholder="25000" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mashina rusumi</label>
                            <input type="text" id="mashina" class="form-control" placeholder="Nexia 1" required>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Bekor qilish</button>
                            <button type="submit" class="btn btn-warning text-white fw-bold">E'lonni joylash</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bron Qilish Modali -->
    <div class="modal fade text-dark" id="bronModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Reysni bron qilish</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="bronForm">
                        <input type="hidden" id="bronReysId">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Ismingiz</label>
                            <input type="text" id="bronIsm" class="form-control" placeholder="Ismingizni kiriting" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Telefon raqamingiz</label>
                            <input type="text" id="bronTel" class="form-control" placeholder="901234567" required>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Bekor qilish</button>
                            <button type="submit" class="btn btn-primary fw-bold">Tasdiqlash</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC07A_DQLZfWSqUtwmv91gUlEg3mHroySU",
            authDomain: "roadsales-d76af.firebaseapp.com",
            databaseURL: "https://roadsales-d76af-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "roadsales-d76af",
            storageBucket: "roadsales-d76af.firebasestorage.app",
            messagingSenderId: "847332122916",
            appId: "1:847332122916:web:cb559bc341b84805cf53b1"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const auth = firebase.auth();

        let currentUser = null;

        // Auth holatini kuzatish
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            const container = document.getElementById('authContainer');
            
            if (user) {
                container.innerHTML = `
                    <button class="btn btn-warning fw-bold text-white px-3" data-bs-toggle="modal" data-bs-target="#addModal">+ Reys kiritish</button>
                    <button onclick="logout()" class="btn btn-outline-light btn-sm">Chiqish (${user.displayName || user.email.split('@')[0]})</button>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="loginWithGoogle()" class="btn btn-google d-flex align-items-center gap-2 shadow-sm">
                        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.87 10.78c-.19-.53-.3-1.1-.3-1.78s.11-1.25.3-1.78L.97 4.96C.35 6.18 0 7.55 0 9s.35 2.82.97 4.04l2.9-2.26z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.97 4.96l2.9 2.26C4.59 5.05 6.62 3.58 9 3.58z"/></svg>
                        Google orqali kirish
                    </button>
                `;
            }
            renderReyslar();
        });

        // Google bilan kirish
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert("Google orqali kirishda xatolik: " + err.message));
        }

        function logout() {
            auth.signOut();
        }

        // Yangi reys kiritish
        document.getElementById('reysForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!currentUser) {
                alert("E'lon qo'shish uchun Google orqali tizimga kiring!");
                return;
            }

            const newReys = {
                ownerUid: currentUser.uid,
                qayerdan: document.getElementById('qayerdan').value,
                qayerga: document.getElementById('qayerga').value,
                vaqt: document.getElementById('vaqt').value.replace('T', ' '),
                joy: parseInt(document.getElementById('joy').value),
                tel: document.getElementById('tel').value,
                narx: Number(document.getElementById('narx').value).toLocaleString(),
                mashina: document.getElementById('mashina').value,
                mijozlar: {}
            };

            db.ref('reyslar').push(newReys).then(() => {
                const modal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
                modal.hide();
                document.getElementById('reysForm').reset();
            }).catch(err => alert("Xatolik: " + err.message));
        });

        // Bron qilish
        function openBronModal(key) {
            document.getElementById('bronReysId').value = key;
            const modal = new bootstrap.Modal(document.getElementById('bronModal'));
            modal.show();
        }

        document.getElementById('bronForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const key = document.getElementById('bronReysId').value;
            const ism = document.getElementById('bronIsm').value;
            const tel = document.getElementById('bronTel').value;

            const reysRef = db.ref('reyslar/' + key);

            reysRef.transaction((reys) => {
                if (reys) {
                    if (reys.joy > 0) {
                        reys.joy -= 1;
                        if (!reys.mijozlar) reys.mijozlar = {};
                        const newMijozKey = db.ref().child('reyslar').push().key;
                        reys.mijozlar[newMijozKey] = { ism: ism, tel: tel };
                    } else {
                        alert("Kechirasiz, ushbu reysda bo'sh joy qolmagan!");
                        return;
                    }
                }
                return reys;
            }, (error, committed) => {
                if (error) {
                    alert("Bron qilishda xatolik: " + error.message);
                } else if (committed) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('bronModal'));
                    modal.hide();
                    document.getElementById('bronForm').reset();
                    alert("Reys muvaffaqiyatli bron qilindi!");
                }
            });
        });

        // Reysni o'chirish
        function deleteReys(key) {
            if (confirm("Ushbu e'lonni o'chirmoqchimisiz?")) {
                db.ref('reyslar/' + key).remove();
            }
        }

        // Reyslarni render qilish
        let latestData = null;
        db.ref('reyslar').on('value', (snapshot) => {
            latestData = snapshot.val();
            renderReyslar();
        });

        function renderReyslar() {
            const container = document.getElementById('reyslarContainer');
            container.innerHTML = '';

            if (!latestData) {
                container.innerHTML = '<p class="text-muted text-center py-4">Hozircha faol reyslar yo\'q.</p>';
                return;
            }

            Object.keys(latestData).reverse().forEach((key) => {
                const item = latestData[key];
                
                // Egalik huquqi tekshiruvi (Eski e'lonlar egasiz bo'lgani uchun ularni istalgan kishi o'chira oladi)
                const isOwner = currentUser && (item.ownerUid === currentUser.uid || !item.ownerUid);

                let mijozlarHTML = '';
                if (isOwner) {
                    if (item.mijozlar) {
                        Object.values(item.mijozlar).forEach(m => {
                            mijozlarHTML += `<li class="small text-dark">👤 <b>${m.ism}</b> (📞 ${m.tel})</li>`;
                        });
                    } else {
                        mijozlarHTML = '<span class="small text-muted">Hozircha bron qilgan mijozlar yo\'q</span>';
                    }
                }

                const joyQolmagan = item.joy <= 0;

                container.innerHTML += `
                    <div class="border rounded-4 p-3 mb-3 position-relative">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <span class="badge badge-custom me-1">🚘 ${item.mashina}</span>
                                <span class="badge bg-success">YANGI REYS</span>
                            </div>
                            <h4 class="fw-bold text-primary m-0">${item.narx} UZS</h4>
                        </div>
                        <h4 class="fw-bold my-2">${item.qayerdan} ➔ ${item.qayerga}</h4>
                        <div class="text-muted small">
                            <div>📅 Vaqt: ${item.vaqt}</div>
                            <div>💺 Bo'sh joylar: <strong class="${joyQolmagan ? 'text-danger' : 'text-success'}">${item.joy} ta</strong></div>
                            <div>📞 Haydovchi tel: ${item.tel}</div>
                        </div>

                        ${isOwner ? `
                        <div class="bron-box border-top">
                            <div class="fw-bold small text-secondary mb-1">👥 Bron qilgan mijozlar:</div>
                            <ul class="list-unstyled mb-0 ms-2">${mijozlarHTML}</ul>
                        </div>
                        ` : ''}

                        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                            ${isOwner ? `<button onclick="deleteReys('${key}')" class="btn btn-outline-danger btn-sm">E'lonni o'chirish</button>` : '<div></div>'}
                            <button onclick="openBronModal('${key}')" class="btn btn-primary px-4 fw-bold" ${joyQolmagan ? 'disabled' : ''}>
                                ${joyQolmagan ? 'Joy yo\'q' : 'Bron qilish'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
