<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoadSales — Yo'lovchi va Haydovchilar Platformasi</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase JS SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .hero-section { background: linear-gradient(135deg, #0d6efd, #0b5ed7); color: white; padding: 3rem 1rem; border-radius: 0 0 20px 20px; }
    .card { border: none; border-radius: 12px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); }
    .badge-status { font-size: 0.85rem; padding: 0.4em 0.8em; }
    .profile-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .masked-info { background: #e9ecef; color: #6c757d; padding: 2px 8px; border-radius: 4px; font-style: italic; }
    .passenger-box { background: #eef2f7; border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-car-side me-2"></i>RoadSales</a>
      <div class="d-flex align-items-center gap-3">
        <div id="userInfo" class="d-none d-flex align-items-center gap-2 text-white">
          <img id="userAvatar" class="profile-img" src="" alt="User">
          <span id="userName" class="fw-semibold"></span>
        </div>
        <button id="authBtn" class="btn btn-light btn-sm fw-bold" onclick="handleAuthAction()">Kirish</button>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="hero-section mb-4 text-center">
    <div class="container">
      <h2 class="fw-bold">Hamyonbop va qulay yo'llar</h2>
      <p class="mb-4">O'zingizga mos reysni toping yoki o'z reysingizni e'lon qiling!</p>
      
      <div class="row g-2 justify-content-center bg-white p-3 rounded-4 shadow text-dark mx-auto" style="max-width: 800px;">
        <div class="col-md-4">
          <select id="filterQayerdan" class="form-select border-0 bg-light">
            <option value="">Qayerdan (Barchasi)</option>
            <option value="Toshkent">Toshkent</option>
            <option value="Samarqand">Samarqand</option>
            <option value="Buxoro">Buxoro</option>
            <option value="Andijon">Andijon</option>
            <option value="Farg'ona">Farg'ona</option>
            <option value="Namangan">Namangan</option>
          </select>
        </div>
        <div class="col-md-4">
          <select id="filterQayerga" class="form-select border-0 bg-light">
            <option value="">Qayerga (Barchasi)</option>
            <option value="Toshkent">Toshkent</option>
            <option value="Samarqand">Samarqand</option>
            <option value="Buxoro">Buxoro</option>
            <option value="Andijon">Andijon</option>
            <option value="Farg'ona">Farg'ona</option>
            <option value="Namangan">Namangan</option>
          </select>
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary w-100 fw-bold" onclick="filterReyslar()"><i class="fa-solid fa-magnifying-glass me-1"></i> Qidirish</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reyslar Ro'yxati -->
  <div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold m-0"><i class="fa-solid fa-list-check me-2 text-primary"></i>Mavjud Reyslar</h4>
      <button class="btn btn-success fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#createReysModal" onclick="checkAuthBeforeModal(event)">
        <i class="fa-solid fa-plus me-1"></i> Reys E'lon Qilish
      </button>
    </div>

    <div id="reyslarContainer" class="row g-4">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Reyslar yuklanmoqda...</p>
      </div>
    </div>
  </div>

  <!-- Reys Yaratish Modali -->
  <div class="modal fade" id="createReysModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="fa-solid fa-car me-2"></i>Yangi Reys Yaratish</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="createReysForm" onsubmit="saveReys(event)">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label font-weight-bold">Qayerdan</label>
                <select id="qayerdan" class="form-select" required>
                  <option value="">Tanlang...</option>
                  <option value="Toshkent">Toshkent</option>
                  <option value="Samarqand">Samarqand</option>
                  <option value="Buxoro">Buxoro</option>
                  <option value="Andijon">Andijon</option>
                  <option value="Farg'ona">Farg'ona</option>
                  <option value="Namangan">Namangan</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label font-weight-bold">Qayerga</label>
                <select id="qayerga" class="form-select" required>
                  <option value="">Tanlang...</option>
                  <option value="Toshkent">Toshkent</option>
                  <option value="Samarqand">Samarqand</option>
                  <option value="Buxoro">Buxoro</option>
                  <option value="Andijon">Andijon</option>
                  <option value="Farg'ona">Farg'ona</option>
                  <option value="Namangan">Namangan</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Aniq Manzil / Mo'ljal</label>
                <input type="text" id="aniqManzil" class="form-control" placeholder="Masalan: Chilonzor Metro" required>
              </div>
              <div class="col-6">
                <label class="form-label">Jo'nash Vaqti</label>
                <input type="datetime-local" id="vaqt" class="form-control" required>
              </div>
              <div class="col-6">
                <label class="form-label">Bo'sh Joy Soni</label>
                <input type="number" id="boShJoy" class="form-control" min="1" max="8" value="4" required>
              </div>
              <div class="col-6">
                <label class="form-label">Narx (SO'M)</label>
                <input type="number" id="narx" class="form-control" placeholder="50000" step="1000" required>
              </div>
              <div class="col-6">
                <label class="form-label">Aloqa Telefon</label>
                <input type="tel" id="userPhone" class="form-control" placeholder="+998901234567" required>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Bekor qilish</button>
            <button type="submit" class="btn btn-success"><i class="fa-solid fa-check me-1"></i> E'lon qilish</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Mijoz Bron Qilish Modali -->
  <div class="modal fade" id="bronModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title"><i class="fa-solid fa-ticket me-2"></i>Reysni Bron Qilish</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="bronForm" onsubmit="confirmBron(event)">
          <input type="hidden" id="selectedReysId">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Ismingiz va Familiyangiz</label>
              <input type="text" id="passengerName" class="form-control" placeholder="Masalan: Ali Valiyev" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Telefon Raqamingiz</label>
              <input type="tel" id="passengerPhone" class="form-control" placeholder="+998901234567" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Yopish</button>
            <button type="submit" class="btn btn-success fw-bold">Bron qilishni tasdiqlash</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6WojPCfBI8pPdLLFi7rRP-lxgbkmEhbk",
      authDomain: "roadsales-f1e34.firebaseapp.com",
      databaseURL: "https://roadsales-f1e34-default-rtdb.firebaseio.com",
      projectId: "roadsales-f1e34",
      storageBucket: "roadsales-f1e34.firebasestorage.app",
      messagingSenderId: "579412038379",
      appId: "1:579412038379:web:7d048d4331cbfd8372a4ae"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let allReyslar = [];

    auth.onAuthStateChanged(user => {
      currentUser = user;
      const authBtn = document.getElementById('authBtn');
      const userInfo = document.getElementById('userInfo');

      if (user) {
        authBtn.innerText = "Chiqish";
        authBtn.classList.replace("btn-light", "btn-outline-light");
        userInfo.classList.remove('d-none');
        document.getElementById('userName').innerText = user.displayName || 'Foydalanuvchi';
        document.getElementById('userAvatar').src = user.photoURL || 'https://via.placeholder.com/40';
      } else {
        authBtn.innerText = "Kirish";
        authBtn.classList.replace("btn-outline-light", "btn-light");
        userInfo.classList.add('d-none');
      }
      renderReyslar(allReyslar);
    });

    function handleAuthAction() {
      if (currentUser) {
        auth.signOut();
      } else {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(error => {
          alert("Kirishda xatolik: " + error.message);
        });
      }
    }

    db.ref('reyslar').on('value', snapshot => {
      const data = snapshot.val();
      allReyslar = [];
      if (data) {
        Object.keys(data).forEach(key => {
          allReyslar.push({ id: key, ...data[key] });
        });
      }
      renderReyslar(allReyslar);
    }, error => {
      document.getElementById('reyslarContainer').innerHTML = '<div class="text-center py-5 text-muted">Hozircha reyslar mavjud emas.</div>';
    });

    function maskPhoneNumber(phone) {
      if (!phone) return 'Yashirilgan';
      if (phone.length >= 9) {
        return phone.substring(0, 6) + '*** ** **';
      }
      return '*** ** **';
    }

    function renderReyslar(list) {
      const container = document.getElementById('reyslarContainer');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-5 text-muted">Hozircha hech qanday reys topilmadi.</div>';
        return;
      }

      const now = new Date().getTime();

      list.slice().reverse().forEach(item => {
        const itemTime = new Date(item.vaqt).getTime();
        const isExpired = itemTime < now;
        const isFull = item.boShJoy <= 0;
        const mapSearchUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.qayerdan + ' ' + (item.aniqManzil || ''))}`;

        const isDriver = currentUser && currentUser.uid === item.driverUid;
        const passengers = item.passengers ? Object.values(item.passengers) : [];
        const myBookingKey = passengers.find(p => currentUser && p.uid === currentUser.uid);

        const showFullContact = isDriver || myBookingKey;
        const displayPhone = showFullContact ? item.userPhone : maskPhoneNumber(item.userPhone);
        const displayDriverName = showFullContact ? (item.driverName || 'Haydovchi') : 'Haydovchi (Maxfiy)';

        let passengersListHtml = '';
        if (isDriver && passengers.length > 0) {
          passengersListHtml = `<div class="mt-2"><strong class="small text-secondary">Bron qilgan yo'lovchilar:</strong>`;
          passengers.forEach(p => {
            passengersListHtml += `<div class="passenger-box mt-1"><i class="fa-solid fa-user me-1"></i> ${p.name} - <a href="tel:${p.phone}" class="text-decoration-none fw-bold">${p.phone}</a></div>`;
          });
          passengersListHtml += `</div>`;
        }

        let actionButtonHtml = '';
        if (myBookingKey) {
          actionButtonHtml = `
            <button class="btn btn-outline-danger btn-sm flex-fill fw-bold" onclick="cancelBron('${item.id}')">
              <i class="fa-solid fa-xmark me-1"></i> Bronni Bekor qilish
            </button>`;
        } else {
          actionButtonHtml = `
            <button class="btn btn-primary btn-sm flex-fill fw-bold" onclick="openBronModal('${item.id}')" ${isExpired || isFull ? 'disabled' : ''}>
              <i class="fa-solid fa-ticket me-1"></i> Bron / Raqamni olish
            </button>`;
        }

        const cardHtml = `
          <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h5 class="fw-bold text-primary m-0">${item.qayerdan} &rarr; ${item.qayerga}</h5>
                  <span class="badge ${isExpired ? 'bg-secondary' : isFull ? 'bg-danger' : 'bg-success'} badge-status">
                    ${isExpired ? 'Eskirgan' : isFull ? 'Joy yo\'q' : item.boShJoy + ' ta joy bor'}
                  </span>
                </div>
                
                <p class="text-muted small mb-2"><i class="fa-solid fa-location-dot text-danger me-1"></i> ${item.aniqManzil || 'Ko\'rsatilmagan'}</p>
                <p class="small mb-1"><i class="fa-regular fa-clock me-1"></i> <strong>Vaqt:</strong> ${new Date(item.vaqt).toLocaleString('uz-UZ')}</p>
                <p class="small mb-1"><i class="fa-solid fa-tag me-1 text-warning"></i> <strong>Narx:</strong> ${Number(item.narx).toLocaleString()} so'm</p>
                <p class="small mb-1"><i class="fa-solid fa-user me-1 text-secondary"></i> <strong>E'lon beruvchi:</strong> ${displayDriverName}</p>
                <p class="small mb-2"><i class="fa-solid fa-phone me-1 text-success"></i> <strong>Tel:</strong> <span class="${showFullContact ? '' : 'masked-info'}">${displayPhone}</span></p>

                ${passengersListHtml}
                
                <div class="mt-auto pt-3 border-top d-flex gap-2">
                  <a href="${mapSearchUrl}" target="_blank" class="btn btn-outline-danger btn-sm flex-fill">
                    <i class="fa-solid fa-map-location-dot me-1"></i> Xarita
                  </a>
                  ${actionButtonHtml}
                </div>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    function filterReyslar() {
      const qayerdan = document.getElementById('filterQayerdan').value;
      const qayerga = document.getElementById('filterQayerga').value;

      const filtered = allReyslar.filter(item => {
        const matchQayerdan = qayerdan ? item.qayerdan === qayerdan : true;
        const matchQayerga = qayerga ? item.qayerga === qayerga : true;
        return matchQayerdan && matchQayerga;
      });

      renderReyslar(filtered);
    }

    function checkAuthBeforeModal(e) {
      if (!currentUser) {
        e.preventDefault();
        e.stopPropagation();
        alert("Reys e'lon qilish uchun avval Google orqali tizimga kiring!");
        handleAuthAction();
      }
    }

    function saveReys(event) {
      event.preventDefault();
      if (!currentUser) return;

      const newReys = {
        driverUid: currentUser.uid,
        driverName: currentUser.displayName,
        qayerdan: document.getElementById('qayerdan').value,
        qayerga: document.getElementById('qayerga').value,
        aniqManzil: document.getElementById('aniqManzil').value,
        vaqt: document.getElementById('vaqt').value,
        boShJoy: parseInt(document.getElementById('boShJoy').value),
        narx: document.getElementById('narx').value,
        userPhone: document.getElementById('userPhone').value,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      };

      db.ref('reyslar').push(newReys).then(() => {
        const modalElement = document.getElementById('createReysModal');
        const modal = bootstrap.Modal.getInstance(modalElement);
        if (modal) modal.hide();
        document.getElementById('createReysForm').reset();
        alert("Reys muvaffaqiyatli e'lon qilindi!");
      }).catch(err => {
        alert("Xatolik yuz berdi: " + err.message);
      });
    }

    function openBronModal(reysId) {
      if (!currentUser) {
        alert("Bron qilish uchun avval tizimga kiring!");
        handleAuthAction();
        return;
      }
      document.getElementById('selectedReysId').value = reysId;
      document.getElementById('passengerName').value = currentUser.displayName || '';
      const modal = new bootstrap.Modal(document.getElementById('bronModal'));
      modal.show();
    }

    function confirmBron(event) {
      event.preventDefault();
      const reysId = document.getElementById('selectedReysId').value;
      const name = document.getElementById('passengerName').value;
      const phone = document.getElementById('passengerPhone').value;

      const reysRef = db.ref(`reyslar/${reysId}`);
      reysRef.transaction(reys => {
        if (reys && reys.boShJoy > 0) {
          reys.boShJoy--;
          if (!reys.passengers) reys.passengers = {};
          reys.passengers[currentUser.uid] = {
            uid: currentUser.uid,
            name: name,
            phone: phone
          };
        }
        return reys;
      }, (error, committed) => {
        if (error || !committed) {
          alert("Bron qilish iloji bo'lmadi yoki joy qolmagan.");
        } else {
          const modalElement = document.getElementById('bronModal');
          const modal = bootstrap.Modal.getInstance(modalElement);
          if (modal) modal.hide();
          alert("Joy muvaffaqiyatli bron qilindi! Endi haydovchi raqami sizga ko'rinadi.");
        }
      });
    }

    function cancelBron(reysId) {
      if (!confirm("Haqiqatan ham bronni bekor qilmoqchimisiz?")) return;

      const reysRef = db.ref(`reyslar/${reysId}`);
      reysRef.transaction(reys => {
        if (reys && reys.passengers && reys.passengers[currentUser.uid]) {
          reys.boShJoy++;
          delete reys.passengers[currentUser.uid];
        }
        return reys;
      }, (error, committed) => {
        if (error || !committed) {
          alert("Bekor qilishda xatolik yuz berdi.");
        } else {
          alert("Broningiz bekor qilindi!");
        }
      });
    }
  </script>
</body>
</html>
