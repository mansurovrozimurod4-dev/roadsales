<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoadSales — Yo'lovchi va Haydovchilar Platformasi</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .hero-section { background: linear-gradient(135deg, #0d6efd, #0b5ed7); color: white; padding: 2.5rem 1rem; border-radius: 0 0 20px 20px; }
    .card { border: none; border-radius: 12px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); }
    .badge-status { font-size: 0.85rem; padding: 0.4em 0.8em; }
    .profile-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }

    .custom-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .custom-modal-content {
      background: white;
      border-radius: 12px;
      width: 95%;
      max-width: 500px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-car-side me-2"></i>RoadSales</a>
      <div class="d-flex align-items-center gap-3">
        <div id="userInfo" class="d-none d-flex align-items-center gap-2 text-white">
          <img id="userAvatar" class="profile-img" src="" alt="User">
          <span id="userName" class="fw-semibold small"></span>
        </div>
        <button id="authBtn" class="btn btn-light btn-sm fw-bold" onclick="handleAuthAction()">
          <i class="fa-brands fa-google me-1"></i> Kirish
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="hero-section mb-4 text-center">
    <div class="container">
      <h2 class="fw-bold">Hamyonbop va qulay yo'llar</h2>
      <p class="mb-3">O'zingizga mos reysni toping yoki o'z reysingizni e'lon qiling!</p>
      
      <div class="row g-2 justify-content-center bg-white p-3 rounded-4 shadow text-dark mx-auto" style="max-width: 800px;">
        <div class="col-md-4">
          <input type="text" id="filterQayerdan" class="form-control border-0 bg-light" placeholder="Qayerdan (Masalan: Toshkent)">
        </div>
        <div class="col-md-4">
          <input type="text" id="filterQayerga" class="form-control border-0 bg-light" placeholder="Qayerga (Masalan: Andijon)">
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary w-100 fw-bold" onclick="filterReyslar()"><i class="fa-solid fa-magnifying-glass me-1"></i> Qidirish</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reyslar Ro'yxati -->
  <div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold m-0"><i class="fa-solid fa-list-check me-2 text-primary"></i>Mavjud Reyslar</h4>
      <button type="button" class="btn btn-success fw-bold shadow-sm" onclick="openCreateModal()">
        <i class="fa-solid fa-plus me-1"></i> Reys E'lon Qilish
      </button>
    </div>

    <div id="reyslarContainer" class="row g-4">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Reyslar yuklanmoqda...</p>
      </div>
    </div>
  </div>

  <!-- Reys Yaratish Modali -->
  <div id="createReysModal" class="custom-modal">
    <div class="custom-modal-content">
      <div class="d-flex justify-content-between align-items-center pb-2 border-bottom mb-3">
        <h5 class="fw-bold m-0 text-primary"><i class="fa-solid fa-car me-2"></i>Yangi Reys Yaratish</h5>
        <button type="button" class="btn-close" onclick="closeModal('createReysModal')"></button>
      </div>
      <form id="createReysForm" onsubmit="saveReys(event)">
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">Qayerdan</label>
            <input type="text" id="qayerdan" class="form-control" placeholder="Jizzax" required>
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">Qayerga</label>
            <input type="text" id="qayerga" class="form-control" placeholder="Guliston" required>
          </div>
          <div class="col-12">
            <label class="form-label">Aniq Manzil / Mo'ljal</label>
            <input type="text" id="aniqManzil" class="form-control" placeholder="Markaziy avtovokzal" required>
          </div>
          <div class="col-6">
            <label class="form-label">Jo'nash Vaqti</label>
            <input type="datetime-local" id="vaqt" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label">Bo'sh Joy Soni</label>
            <input type="number" id="boShJoy" class="form-control" min="1" max="8" value="4" required>
          </div>
          <div class="col-6">
            <label class="form-label">Narx (SO'M)</label>
            <input type="number" id="narx" class="form-control" placeholder="50000" step="1000" required>
          </div>
          <div class="col-6">
            <label class="form-label">Aloqa Telefon</label>
            <input type="tel" id="userPhone" class="form-control" placeholder="+998901234567" required>
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4 pt-2 border-top">
          <button type="button" class="btn btn-secondary" onclick="closeModal('createReysModal')">Bekor qilish</button>
          <button type="submit" id="submitBtn" class="btn btn-success"><i class="fa-solid fa-check me-1"></i> E'lon qilish</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bron Qilish Modali -->
  <div id="bronModal" class="custom-modal">
    <div class="custom-modal-content">
      <div class="d-flex justify-content-between align-items-center pb-2 border-bottom mb-3">
        <h5 class="fw-bold m-0 text-primary"><i class="fa-solid fa-ticket me-2"></i>Reysni Bron Qilish</h5>
        <button type="button" class="btn-close" onclick="closeModal('bronModal')"></button>
      </div>
      <form id="bronForm" onsubmit="confirmBron(event)">
        <input type="hidden" id="selectedReysId">
        <div class="mb-3">
          <label class="form-label fw-semibold">Ism va Familiyangiz</label>
          <input type="text" id="passengerName" class="form-control" placeholder="Masalan: Ali Valiyev" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Telefon Raqamingiz</label>
          <input type="tel" id="passengerPhone" class="form-control" placeholder="+998901234567" required>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4 pt-2 border-top">
          <button type="button" class="btn btn-secondary" onclick="closeModal('bronModal')">Bekor qilish</button>
          <button type="submit" id="bronSubmitBtn" class="btn btn-primary"><i class="fa-solid fa-check me-1"></i> Tasdiqlash va Bron qilish</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6WojPCfBI8pPdLLFi7rRP-lxgbkmEhbk",
      authDomain: "roadsales-f1e34.firebaseapp.com",
      databaseURL: "https://roadsales-f1e34-default-rtdb.firebaseio.com",
      projectId: "roadsales-f1e34",
      storageBucket: "roadsales-f1e34.firebasestorage.app",
      messagingSenderId: "579412038379",
      appId: "1:579412038379:web:7d048d4331cbfd8372a4ae"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let allReyslar = [];

    auth.onAuthStateChanged(user => {
      currentUser = user;
      const authBtn = document.getElementById('authBtn');
      const userInfo = document.getElementById('userInfo');

      if (user) {
        authBtn.innerHTML = '<i class="fa-solid fa-right-from-bracket me-1"></i> Chiqish';
        authBtn.classList.replace("btn-light", "btn-outline-light");
        userInfo.classList.remove('d-none');
        document.getElementById('userName').innerText = user.displayName || 'Foydalanuvchi';
        document.getElementById('userAvatar').src = user.photoURL || 'https://via.placeholder.com/35';
      } else {
        authBtn.innerHTML = '<i class="fa-brands fa-google me-1"></i> Kirish';
        authBtn.classList.replace("btn-outline-light", "btn-light");
        userInfo.classList.add('d-none');
      }
    });

    function handleAuthAction(autoOpenModal = false) {
      if (currentUser) {
        auth.signOut();
      } else {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider)
          .then(() => {
            if (autoOpenModal) {
              document.getElementById('createReysModal').style.display = 'flex';
            }
          })
          .catch(error => {
            alert("Kirishda xatolik yuz berdi: " + error.message);
          });
      }
    }

    db.ref('reyslar').on('value', snapshot => {
      const data = snapshot.val();
      allReyslar = [];
      if (data) {
        Object.keys(data).forEach(key => {
          allReyslar.push({ id: key, ...data[key] });
        });
      }
      renderReyslar(allReyslar);
    });

    function renderReyslar(list) {
      const container = document.getElementById('reyslarContainer');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-5 text-muted">Hozircha hech qanday reys topilmadi.</div>';
        return;
      }

      list.slice().reverse().forEach(item => {
        const isFull = item.boShJoy <= 0;
        const mapSearchUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.qayerdan + ' ' + (item.aniqManzil || ''))}`;
        const formatVaqt = item.vaqt ? new Date(item.vaqt).toLocaleString('uz-UZ') : 'Vaqt ko\'rsatilmadi';

        // Haydovchi o'zi ko'rishi uchun mijozlar ro'yxatini shakllantirish
        const isOwner = currentUser && currentUser.uid === item.driverUid;
        let passengersHtml = '';

        if (isOwner && item.passengers) {
          const passList = Object.values(item.passengers);
          passengersHtml = `
            <div class="mt-3 pt-2 border-top bg-light p-2 rounded">
              <strong class="text-success small"><i class="fa-solid fa-users me-1"></i> Bron qilgan yo'lovchilar (${passList.length} ta):</strong>
              <ul class="list-unstyled mb-0 mt-1 small">
                ${passList.map(p => `
                  <li class="d-flex justify-content-between border-bottom py-1">
                    <span><strong>${p.name}</strong></span>
                    <a href="tel:${p.phone}" class="text-decoration-none fw-bold"><i class="fa-solid fa-phone me-1"></i>${p.phone}</a>
                  </li>
                `).join('')}
              </ul>
            </div>
          `;
        }

        const cardHtml = `
          <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h5 class="fw-bold text-primary m-0">${item.qayerdan} &rarr; ${item.qayerga}</h5>
                  <span class="badge ${isFull ? 'bg-danger' : 'bg-success'} badge-status">
                    ${isFull ? 'Joy yo\'q' : item.boShJoy + ' ta joy bor'}
                  </span>
                </div>
                
                <p class="text-muted small mb-2"><i class="fa-solid fa-location-dot text-danger me-1"></i> ${item.aniqManzil || 'Ko\'rsatilmagan'}</p>
                <p class="small mb-1"><i class="fa-regular fa-clock me-1"></i> <strong>Vaqt:</strong> ${formatVaqt}</p>
                <p class="small mb-1"><i class="fa-solid fa-tag me-1 text-warning"></i> <strong>Narx:</strong> ${Number(item.narx).toLocaleString()} so'm</p>
                <p class="small mb-1"><i class="fa-solid fa-user me-1 text-secondary"></i> <strong>Haydovchi:</strong> ${item.driverName || 'Anonim'}</p>
                <p class="small mb-2"><i class="fa-solid fa-phone me-1 text-success"></i> <strong>Tel:</strong> <a href="tel:${item.userPhone}" class="fw-bold text-decoration-none text-dark">${item.userPhone}</a></p>
                
                ${passengersHtml}

                <div class="mt-auto pt-3 border-top d-flex gap-2">
                  <a href="${mapSearchUrl}" target="_blank" class="btn btn-outline-danger btn-sm flex-fill">
                    <i class="fa-solid fa-map-location-dot me-1"></i> Xarita
                  </a>
                  <button onclick="openBronModal('${item.id}')" class="btn btn-primary btn-sm flex-fill fw-bold" ${isFull ? 'disabled' : ''}>
                    <i class="fa-solid fa-ticket me-1"></i> ${isFull ? 'Joy qolmagan' : 'Bron Qilish'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    function openBronModal(reysId) {
      if (!currentUser) {
        alert("Bron qilish uchun avval Google hisobingiz bilan tizimga kiring!");
        handleAuthAction();
        return;
      }
      document.getElementById('selectedReysId').value = reysId;
      document.getElementById('passengerName').value = currentUser.displayName || '';
      document.getElementById('bronModal').style.display = 'flex';
    }

    function confirmBron(event) {
      event.preventDefault();
      const reysId = document.getElementById('selectedReysId').value;
      const name = document.getElementById('passengerName').value.trim();
      const phone = document.getElementById('passengerPhone').value.trim();

      const btn = document.getElementById('bronSubmitBtn');
      btn.disabled = true;

      const reysRef = db.ref(`reyslar/${reysId}`);
      
      reysRef.transaction(reys => {
        if (reys && reys.boShJoy > 0) {
          reys.boShJoy--;
          if (!reys.passengers) reys.passengers = {};
          const newPassKey = 'pass_' + Date.now();
          reys.passengers[newPassKey] = {
            uid: currentUser.uid,
            name: name,
            phone: phone,
            timestamp: firebase.database.ServerValue.TIMESTAMP
          };
        }
        return reys;
      }, (error, committed) => {
        btn.disabled = false;
        if (error || !committed) {
          alert("Bron qilishda xatolik yuz berdi yoki bo'sh joy qolmagan.");
        } else {
          closeModal('bronModal');
          document.getElementById('bronForm').reset();
          alert("Reys muvaffaqiyatli bron qilindi! Telefon raqamingiz haydovchiga yetkazildi.");
        }
      });
    }

    function openCreateModal() {
      if (!currentUser) {
        if (confirm("Reys e'lon qilish uchun avval Google hisobingiz bilan kirishingiz kerak. Kirishni xohlaysizmi?")) {
          handleAuthAction(true);
        }
        return;
      }
      document.getElementById('createReysModal').style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function saveReys(event) {
      event.preventDefault();
      if (!currentUser) return;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      const newReys = {
        driverUid: currentUser.uid,
        driverName: currentUser.displayName || 'Haydovchi',
        qayerdan: document.getElementById('qayerdan').value.trim(),
        qayerga: document.getElementById('qayerga').value.trim(),
        aniqManzil: document.getElementById('aniqManzil').value.trim(),
        vaqt: document.getElementById('vaqt').value,
        boShJoy: parseInt(document.getElementById('boShJoy').value),
        narx: document.getElementById('narx').value,
        userPhone: document.getElementById('userPhone').value.trim(),
        createdAt: firebase.database.ServerValue.TIMESTAMP
      };

      db.ref('reyslar').push(newReys)
        .then(() => {
          submitBtn.disabled = false;
          closeModal('createReysModal');
          document.getElementById('createReysForm').reset();
        })
        .catch(err => {
          submitBtn.disabled = false;
          alert("Xatolik: " + err.message);
        });
    }

    function filterReyslar() {
      const qayerdan = document.getElementById('filterQayerdan').value.toLowerCase().trim();
      const qayerga = document.getElementById('filterQayerga').value.toLowerCase().trim();

      const filtered = allReyslar.filter(item => {
        const matchQayerdan = qayerdan ? item.qayerdan.toLowerCase().includes(qayerdan) : true;
        const matchQayerga = qayerga ? item.qayerga.toLowerCase().includes(qayerga) : true;
        return matchQayerdan && matchQayerga;
      });

      renderReyslar(filtered);
    }
  </script>
</body>
</html>
